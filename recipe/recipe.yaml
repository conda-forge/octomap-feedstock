schema_version: 1

context:
  name: octomap
  version: "2.0.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/OctoMap/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: a47231ec8b7cca3147e611caf31a100dfc24a2257dcc58cff1a047519586befa
  patches:
    # Free the root node when deleteNode() removes the last node (#27);
    # remove once an OctoMap release includes https://github.com/OctoMap/octomap/pull/450
    - 0001-free-the-root-node-in-deleteNode.patch
    # Restore the ament index marker for ROS 2 that 2.0.0 stopped installing (#27);
    # remove once an OctoMap release includes https://github.com/OctoMap/octomap/pull/451
    - 0002-restore-the-ament-index-marker.patch

build:
  number: 1
  script:
    - if: unix
      then: bash "${RECIPE_DIR}/build.sh"
    - if: win
      then: call "%RECIPE_DIR%\\build.bat"

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake
    - make
    - pkg-config
  run_exports:
    - ${{ pin_subpackage("octomap", upper_bound="x.x") }}

tests:
  - package_contents:
      files:
        - if: win
          then: Library/share/ament_index/resource_index/packages/octomap
          else: share/ament_index/resource_index/packages/octomap
  - files:
      recipe:
        - tests/
    requirements:
      run:
        - ${{ compiler("cxx") }}
        - ${{ stdlib("c") }}
        - cmake
        - ninja
        - pkg-config
    script:
      - pkg-config --modversion octomap
      - pkg-config --libs octomap
      - cmake -S tests -B tests/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build tests/build --config Release
      - ctest --test-dir tests/build --output-on-failure --build-config Release

about:
  homepage: https://github.com/OctoMap/octomap
  repository: https://github.com/OctoMap/octomap
  license: BSD-3-Clause
  license_family: BSD
  license_file: octomap/LICENSE.txt
  summary: An Efficient Probabilistic 3D Mapping Framework Based on Octrees

extra:
  feedstock-name: octomap
  recipe-maintainers:
    - jeongseok-meta
    - jcarpent
    - wolfv
